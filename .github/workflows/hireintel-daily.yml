name: HireIntel Daily Job Sourcing

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  hireintel:
    name: Run HireIntel
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      APIFY_MONTHLY_LIMIT_USD: ${{ secrets.APIFY_MONTHLY_LIMIT_USD }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}

      HIREINTEL_MAX_KEYWORDS: "1"
      HIREINTEL_MAX_JOBS_PER_KEYWORD: "1"
      HIREINTEL_DRY_RUN: "true"
      HIREINTEL_SAVE_TO_DATABASE: "false"
      HIREINTEL_SEND_EMAIL_REPORT: "false"

    steps:
      - name: Checkout HireIntel
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HireIntel
        run: node src/index.js
