name: HireIntel Daily Job Sourcing

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional custom keyword for demo/testing. Leave blank to process all configured keywords."
        required: false
        type: string
        default: ""

      max_jobs_per_source:
        description: "Maximum jobs per source per keyword"
        required: false
        type: string
        default: "10"

      send_email:
        description: "Send Gmail report"
        required: false
        type: boolean
        default: true

      save_to_database:
        description: "Save jobs to Supabase"
        required: false
        type: boolean
        default: true

jobs:
  hireintel:
    name: Run HireIntel
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # One Apify account per source, each with its own budget.
      # The limit secrets are optional; each defaults to $5/month.
      APIFY_TOKEN_NAUKRI: ${{ secrets.APIFY_TOKEN_NAUKRI }}
      APIFY_TOKEN_LINKEDIN: ${{ secrets.APIFY_TOKEN_LINKEDIN }}
      APIFY_MONTHLY_LIMIT_NAUKRI_USD: ${{ secrets.APIFY_MONTHLY_LIMIT_NAUKRI_USD }}
      APIFY_MONTHLY_LIMIT_LINKEDIN_USD: ${{ secrets.APIFY_MONTHLY_LIMIT_LINKEDIN_USD }}

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
      GMAIL_TO: ${{ secrets.GMAIL_TO }}
      # Optional: comma-separated addresses. Leave the secrets unset to skip.
      GMAIL_CC: ${{ secrets.GMAIL_CC }}
      GMAIL_BCC: ${{ secrets.GMAIL_BCC }}

      HIREINTEL_CUSTOM_KEYWORD: ${{ inputs.keyword }}

      # 0 = process all configured keywords
      HIREINTEL_MAX_KEYWORDS: "0"

      HIREINTEL_MAX_JOBS_PER_KEYWORD: ${{ inputs.max_jobs_per_source }}

      HIREINTEL_DRY_RUN: "false"
      HIREINTEL_SAVE_TO_DATABASE: ${{ inputs.save_to_database }}
      HIREINTEL_SEND_EMAIL_REPORT: ${{ inputs.send_email }}

    steps:
      - name: Checkout HireIntel
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run HireIntel
        run: node src/index.js
